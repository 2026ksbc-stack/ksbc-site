<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | 사단법인 한국방송비평학회</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

{% include header.html %}

<div class="page-header">
  <h1>공지사항</h1>
  <p>학회의 공식 소식과 안내사항을 전해드립니다</p>
</div>

<main>
  <section class="section">
    <div class="container">
      <h2>공지사항</h2>
      <ul class="item-list" id="notice-list">
        <p style="margin-top:16px;"><li class="empty-state">불러오는 중...</li></p>
      </ul>
    </div>
  </section>
</main>

{% include footer.html %}

<script src="assets/script.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  loadJSON("data/notices.json")
    .then((items) => renderAccordionList(document.getElementById("notice-list"), items))
    .catch((err) => {
      document.getElementById("notice-list").innerHTML = '<li class="empty-state">공지사항을 불러오지 못했습니다.</li>';
      console.error(err);
    });
</script>

</body>
</html>
