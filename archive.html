<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 | 사단법인 한국방송비평학회</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

{% include header.html %}

<div class="page-header">
  <h1>자료실</h1>
  <p>정관 등 학회의 공식 문서와 자료를 다운로드하실 수 있습니다</p>
</div>

<main>
  <section class="section">
    <div class="container">
      <ul class="item-list" id="archive-list">
        <li class="empty-state">불러오는 중...</li>
      </ul>
    </div>
  </section>
</main>

{% include footer.html %}

<script src="assets/script.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  loadJSON("data/archive.json")
    .then((items) => renderArchiveList(document.getElementById("archive-list"), items))
    .catch((err) => {
      document.getElementById("archive-list").innerHTML = '<li class="empty-state">자료를 불러오지 못했습니다.</li>';
      console.error(err);
    });
</script>

</body>
</html>
